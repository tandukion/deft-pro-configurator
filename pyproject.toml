[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deft-pro-configurator"
version = "1.0.3"
description = "GTK configurator and evdev/uinput remapper for the Elecom DEFT Pro trackball"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["deft_pro"]
package-dir = {"" = "src"}
